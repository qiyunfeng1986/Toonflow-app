<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大排档雨夜对决 · 视频预览</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(232, 177, 77, 0.12), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(95, 181, 176, 0.1), transparent 60%),
      linear-gradient(180deg, #1a140c 0%, #0c0a06 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8d9b0;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 0.15em;
    color: #e8b14d;
    margin-bottom: 8px;
    text-align: center;
    text-shadow: 0 0 20px rgba(232, 177, 77, 0.3);
  }
  .subtitle {
    color: #8a7a55;
    font-size: 13px;
    letter-spacing: 0.25em;
    text-align: center;
    margin-bottom: 40px;
  }
  .version-card {
    border: 1px solid rgba(232, 177, 77, 0.25);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 32px;
    background: rgba(15, 12, 8, 0.6);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .version-card:hover {
    border-color: rgba(95, 181, 176, 0.4);
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8);
  }
  .version-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .version-tag {
    background: linear-gradient(135deg, #e8b14d, #c89035);
    color: #1a140c;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 3px;
    letter-spacing: 0.15em;
  }
  .version-tag.blue {
    background: linear-gradient(135deg, #5fb5b0, #3a8a85);
  }
  .version-title {
    font-size: 18px;
    color: #e8b14d;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .version-desc {
    color: #8a7a55;
    font-size: 13px;
    margin-left: auto;
  }
  .main-video {
    width: 100%;
    border-radius: 4px;
    background: #000;
    display: block;
  }
  .video-info {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(232, 177, 77, 0.15);
    font-size: 12px;
    color: #8a7a55;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .video-info span {
    color: #c8a86a;
  }
  .clips {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .clip {
    border: 1px solid rgba(232, 177, 77, 0.15);
    border-radius: 6px;
    overflow: hidden;
    background: rgba(10, 8, 6, 0.5);
  }
  .clip video {
    width: 100%;
    display: block;
    background: #000;
  }
  .clip-info {
    padding: 10px 14px;
    font-size: 12px;
    color: #c8a86a;
    letter-spacing: 0.05em;
    border-top: 1px solid rgba(232, 177, 77, 0.1);
  }
  .ref-image {
    text-align: center;
    padding: 20px;
    border: 1px dashed rgba(232, 177, 77, 0.2);
    border-radius: 6px;
    margin-bottom: 40px;
  }
  .ref-image img {
    max-width: 100%;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .ref-label {
    color: #8a7a55;
    font-size: 12px;
    letter-spacing: 0.2em;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>大排档 · 雨夜对决</h1>
    <div class="subtitle">VIDEO PREVIEW · 所有生成版本</div>

    <div class="ref-image">
      <img src="https://platform-outputs.agnes-ai.space/images/t2i/c48e8035f42c4d4e9b3d52f08a79386d.png" alt="参考图">
      <div class="ref-label">统一参考图 · REFERENCE IMAGE</div>
    </div>

    <div class="version-card">
      <div class="version-header">
        <span class="version-tag">方案 A</span>
        <span class="version-title">戏剧张力版 · 眼神+手部动作</span>
        <span class="version-desc">15秒 · 三段拼接</span>
      </div>
      <video class="main-video" controls autoplay muted loop playsinline>
        <source src="/drama_final.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <span>眼神对峙</span><span>·</span>
        <span>握酒瓶</span><span>·</span>
        <span>一人起身</span>
      </div>
      <div class="clips">
        <div class="clip">
          <video controls muted playsinline preload="metadata"><source src="/drama_1.mp4" type="video/mp4"></video>
          <div class="clip-info">片段 1 · 眼神对峙 + 伸手</div>
        </div>
        <div class="clip">
          <video controls muted playsinline preload="metadata"><source src="/drama_2.mp4" type="video/mp4"></video>
          <div class="clip-info">片段 2 · 握酒瓶 + 紧绷</div>
        </div>
        <div class="clip">
          <video controls muted playsinline preload="metadata"><source src="/drama_3.mp4" type="video/mp4"></video>
          <div class="clip-info">片段 3 · 起身对峙</div>
        </div>
      </div>
    </div>

    <div class="version-card">
      <div class="version-header">
        <span class="version-tag blue">统一参考图</span>
        <span class="version-title">纯氛围感版 · 镜头运动</span>
        <span class="version-desc">15秒 · 三段拼接</span>
      </div>
      <video class="main-video" controls muted loop playsinline>
        <source src="/coherent_final.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <span>镜头推进</span><span>·</span>
        <span>轻微前移</span><span>·</span>
        <span>环绕镜头</span>
      </div>
      <div class="clips">
        <div class="clip">
          <video controls muted playsinline preload="metadata"><source src="/coherent_1.mp4" type="video/mp4"></video>
          <div class="clip-info">片段 1 · 缓慢推进</div>
        </div>
        <div class="clip">
          <video controls muted playsinline preload="metadata"><source src="/coherent_2.mp4" type="video/mp4"></video>
          <div class="clip-info">片段 2 · 轻微前倾</div>
        </div>
        <div class="clip">
          <video controls muted playsinline preload="metadata"><source src="/coherent_3.mp4" type="video/mp4"></video>
          <div class="clip-info">片段 3 · 环绕镜头</div>
        </div>
      </div>
    </div>

    <div class="version-card">
      <div class="version-header">
        <span class="version-tag blue">早期版本</span>
        <span class="version-title">文字直接生成 · 含夸张动作</span>
        <span class="version-desc">15秒 · 对比参考</span>
      </div>
      <video class="main-video" controls muted loop playsinline>
        <source src="/fight_video_final.mp4" type="video/mp4">
      </video>
      <div class="video-info">
        <span>一致性较低</span><span>·</span>
        <span>动作夸张</span><span>·</span>
        <span>仅作对比参考</span>
      </div>
    </div>

  </div>
</body>
</html>
