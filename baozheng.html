<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包拯 · 形象照</title>
<style>
  body {
    margin: 0;
    padding: 60px 20px;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212, 165, 75, 0.18), transparent 60%),
      linear-gradient(180deg, #1a1410 0%, #0a0806 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif;
    color: #e8d9b0;
    text-align: center;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 42px;
    letter-spacing: 0.3em;
    color: #d4a54b;
    margin: 0 0 10px;
    text-shadow: 0 0 30px rgba(212, 165, 75, 0.4);
  }
  .title-en {
    color: #6a5a3a;
    font-size: 12px;
    letter-spacing: 0.4em;
    margin-bottom: 40px;
    text-transform: uppercase;
  }
  .image-frame {
    display: inline-block;
    padding: 8px;
    background: linear-gradient(135deg, #d4a54b, #8a6a25, #d4a54b);
    border-radius: 4px;
    box-shadow:
      0 0 0 1px rgba(212, 165, 75, 0.3),
      0 40px 80px -20px rgba(0, 0, 0, 0.9),
      0 0 60px rgba(212, 165, 75, 0.15);
  }
  .image-frame img {
    display: block;
    max-width: 100%;
    border-radius: 2px;
    background: #000;
  }
  .info {
    margin-top: 30px;
    padding: 20px 40px;
    border: 1px solid rgba(212, 165, 75, 0.25);
    border-radius: 4px;
    background: rgba(20, 16, 12, 0.5);
    display: inline-block;
    text-align: left;
  }
  .info-row {
    display: flex;
    gap: 30px;
    font-size: 13px;
    color: #8a7a55;
    letter-spacing: 0.1em;
    line-height: 2;
  }
  .info-row b {
    color: #d4a54b;
    font-weight: 500;
    min-width: 80px;
    display: inline-block;
  }
  .quote {
    margin-top: 40px;
    font-size: 15px;
    color: #a89060;
    letter-spacing: 0.3em;
    font-style: italic;
  }
  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4a54b, transparent);
    margin: 30px auto;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>包 拯</h1>
    <div class="title-en">Bao Zheng · The Upright Judge</div>

    <div class="image-frame">
      <img src="https://platform-outputs.agnes-ai.space/images/t2i/52d10718ef824646b633c9bbe5379f46.png" alt="包拯形象照">
    </div>

    <div class="info">
      <div class="info-row"><b>朝代</b><span>北宋</span></div>
      <div class="info-row"><b>身份</b><span>开封府尹 · 龙图阁直学士</span></div>
      <div class="info-row"><b>特征</b><span>黑面 · 额有月牙 · 铁面无私</span></div>
      <div class="info-row"><b>风格</b><span>电影级肖像 · 戏剧性光影</span></div>
      <div class="info-row"><b>尺寸</b><span>1024 × 1024</span></div>
    </div>

    <div class="divider"></div>
    <div class="quote">「关节不到，有阎罗包老」</div>
  </div>
</body>
</html>
